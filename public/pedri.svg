<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="barcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a50044" />
      <stop offset="50%" stop-color="#004d98" />
      <stop offset="100%" stop-color="#edbb00" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#edbb00" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#a50044" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#040817" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <rect width="600" height="750" fill="#070e24" rx="30" />
  <circle cx="300" cy="320" r="240" fill="url(#glowGrad)" />

  <!-- Stylized Geometric Silhouette & Jersey Art -->
  <g transform="translate(300, 360)">
    <!-- Aura Ring -->
    <circle cx="0" cy="-40" r="160" fill="none" stroke="url(#barcaGrad)" stroke-width="4" stroke-dasharray="10 15" opacity="0.6" />
    <circle cx="0" cy="-40" r="135" fill="#0c1538" stroke="#edbb00" stroke-width="2" opacity="0.9" />

    <!-- Head / Silhouette -->
    <circle cx="0" cy="-90" r="55" fill="#fcd34d" opacity="0.9" />
    <path d="M -50 -105 C -40 -150, 40 -150, 50 -105 C 30 -115, -30 -115, -50 -105 Z" fill="#1e1b4b" />

    <!-- Jersey Body / Shoulders -->
    <path d="M -95 50 C -95 -20, -50 -35, 0 -35 C 50 -35, 95 -20, 95 50 L 80 120 L -80 120 Z" fill="#a50044" />
    <!-- Barça Stripes -->
    <path d="M -30 -35 L -30 120 L 0 120 L 0 -35 Z" fill="#004d98" />
    <path d="M 30 -35 L 30 120 L 60 120 L 60 -25 Z" fill="#004d98" />

    <!-- Number 8 on Jersey -->
    <text x="0" y="55" fill="#ffd700" font-family="Arial, sans-serif" font-weight="900" font-size="52" text-anchor="middle" filter="url(#glow)">8</text>
    <text x="0" y="85" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="14" letter-spacing="4" text-anchor="middle">PEDRI</text>
  </g>

  <!-- Crest & Tagline -->
  <text x="300" y="600" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="28" letter-spacing="6" text-anchor="middle">PEDRI GONZÁLEZ</text>
  <text x="300" y="635" fill="#edbb00" font-family="monospace" font-size="14" letter-spacing="4" text-anchor="middle">FC BARCELONA #8 · SPAIN</text>
</svg>
